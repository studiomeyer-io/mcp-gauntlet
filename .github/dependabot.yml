version: 2
# Conservative policy: weekly grouped patch+minor updates, semver-major
# ignored (we bump majors deliberately), monthly grouped CI-action bumps.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # dtolnay/rust-toolchain encodes the TOOLCHAIN VERSION in its tag — the
    # MSRV job pins it deliberately (currently 1.89). A dependabot "bump"
    # rewrites the pin to whatever the newest tag is, which both defeats the
    # MSRV check and can point at a Rust version that does not exist yet
    # (PR #9 tried to install nonexistent 1.100.0). Never auto-bump it.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
